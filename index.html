<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brian Wagon</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<script src="vendor/brush.js"></script>
<script src="brush-style.js"></script>
<script src="core/rig-core.js"></script>
<script src="core/stage.js"></script>
<script src="brian-wagon.js"></script>
<style>
  :root { --ink: #1b2b3a; --panel: #f6f3ee; --line: #d8d2c6; --accent: #c8322b; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: #ece8e1; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  #stage canvas { display: block; border: 1px solid var(--line); max-width: 100%; height: auto; }
  .checker { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  .light { background: #f4f1ea; } .dark { background: #20242a; } .grey { background: #808890; }
  aside { width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; color: #6b6558; }
  h2:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  button { font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; background: #fff; cursor: pointer; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  input[type=range] { flex: 1; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .hint { color: #6b6558; font-size: 12px; margin-top: 10px; }
  output { min-width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div id="stage"></div>
  <aside>
    <h2>Emotion</h2>
    <div class="grid" id="emotions"></div>
    <label>Intensity <input id="intensity" type="range" min="0" max="1" step="0.05" value="1"><output id="intensityOut">1</output></label>
    <label>Blend (s) <input id="blend" type="range" min="0" max="2" step="0.05" value="0.3"><output id="blendOut">0.3</output></label>

    <h2>Triggers</h2>
    <div class="row">
      <button data-trigger="blink">Blink</button><button data-trigger="hop">Hop</button>
      <button data-trigger="confetti">Confetti</button><button data-trigger="bubbles">Bubbles</button>
    </div>

    <h2>Pincer</h2>
    <div class="row" id="props"></div>
    <div class="row"><button id="release">Release</button><button id="reachBtn" title="Arm reaches for the mouse">Reach mouse</button></div>
    <label>Jaw <input id="jaw" type="range" min="0" max="1" step="0.05" value="0.25"><output id="jawOut">auto</output></label>
    <label><input id="jawAuto" type="checkbox" checked> Jaw follows emotion</label>

    <h2>Motion</h2>
    <div class="row"><button id="faceL">◀ Face</button><button id="faceR">Face ▶</button><button id="center">Centre</button></div>
    <label><input id="follow" type="checkbox" checked> Eyes follow mouse</label>

    <h2>Look</h2>
    <label>Size <input id="size" type="range" min="8" max="90" step="1" value="50"><output id="sizeOut">50%</output></label>
    <label>Drift <input id="drift" type="range" min="0" max="0.6" step="0.01" value="0.3"><output id="driftOut">0.3</output></label>
    <label>Boil <input id="boil" type="range" min="0" max="0.08" step="0.005" value="0.03"><output id="boilOut">0.03</output></label>
    <label><input id="shadows" type="checkbox"> Drop shadows</label>
    <label title="Watercolour fills and ink outlines via p5.brush (needs WebGL2). Slow: expect a few frames per second."><input id="brush" type="checkbox"> Hand-drawn (p5.brush)</label>
    <label>Background
      <select id="bg"><option value="checker">Checker</option><option value="light">Light</option><option value="grey" selected>Grey</option><option value="dark">Dark</option></select>
    </label>
    <label>Seed <input id="seed" type="number" value="7" style="width:6em"> <button id="reseed">Apply</button></label>

    <h2>Output</h2>
    <div class="row"><button id="pause">Pause</button><button id="step">Step</button><button id="save">Save PNG (1080p)</button></div>
    <p class="hint">Click the stage to drive there. Keys: 1–9 the first nine emotions (buttons for the rest), ←/→ face, space pause, B blink, H hop, C confetti, S save, P cycle props, R release.</p>
  </aside>
</main>
<script>
  const W = 960, H = 540, FPS = 30;
  let propIx = -1;
  let b, paused = false, stepOnce = false, reaching = false;
  const $ = (id) => document.getElementById(id);

  function makeRig(seed) {
    const old = b;
    b = new BrianWagon({
      seed, x: old ? old.x : W * 0.35, y: H * 0.88, scale: sizeToScale(),
      facing: old ? old.facing : 'right', emotion: old ? old.emotion : 'neutral',
      drift: +$('drift').value, boil: +$('boil').value, shadows: $('shadows').checked,
    });
    if ($('brush').checked) b.setStyle('brush');
  }
  const sizeToScale = () => (+$('size').value / 100) * H / 10;

  function setup() {
    createCanvas(W, H).parent('stage');
    frameRate(FPS);
    $('stage').querySelector('canvas').classList.add('grey');
    makeRig(+$('seed').value);

    for (const [i, e] of BrianWagon.EMOTIONS.entries()) {
      const btn = document.createElement('button');
      btn.textContent = i < 9 ? `${i + 1} ${e}` : e;
      btn.dataset.emotion = e;
      btn.onclick = () => setEmotion(e);
      $('emotions').append(btn);
    }
    markEmotion();
    document.querySelectorAll('[data-trigger]').forEach((el) => (el.onclick = () => b.trigger(el.dataset.trigger)));
    for (const p of BrianWagon.PROPS) {
      const btn = document.createElement('button');
      btn.textContent = p;
      btn.onclick = () => b.grab(p);
      $('props').append(btn);
    }
    $('release').onclick = () => b.release();
    $('reachBtn').onclick = () => { reaching = !reaching; $('reachBtn').classList.toggle('on', reaching); if (!reaching) b.reach(null); };
    $('jaw').oninput = () => { $('jawAuto').checked = false; $('jawOut').textContent = $('jaw').value; b.jaw(+$('jaw').value); };
    $('jawAuto').onchange = () => { if ($('jawAuto').checked) { b.jaw(null); $('jawOut').textContent = 'auto'; } else b.jaw(+$('jaw').value); };
    $('faceL').onclick = () => b.face('left');
    $('faceR').onclick = () => b.face('right');
    $('center').onclick = () => b.moveTo(W / 2, 1.5);
    $('reseed').onclick = () => makeRig(+$('seed').value);
    $('pause').onclick = togglePause;
    $('step').onclick = () => { paused = true; stepOnce = true; $('pause').classList.add('on'); };
    $('save').onclick = savePng;
    $('bg').onchange = (e) => { $('stage').querySelector('canvas').className = e.target.value; };
    $('shadows').onchange = (e) => { b.opts.shadows = e.target.checked; };
    $('brush').onchange = (e) => {
      try { b.setStyle(e.target.checked ? 'brush' : 'flat'); }
      catch (err) { e.target.checked = false; b.setStyle('flat'); alert('Hand-drawn style unavailable: ' + err.message); }
    };
    for (const id of ['intensity', 'blend', 'size', 'drift', 'boil']) {
      $(id).oninput = () => {
        $(id + 'Out').textContent = id === 'size' ? $(id).value + '%' : $(id).value;
        if (id === 'size') b.scale = sizeToScale();
        if (id === 'drift') b.opts.drift = +$(id).value;
        if (id === 'boil') b.opts.boil = +$(id).value;
      };
    }
  }

  function setEmotion(e) {
    b.setEmotion(e, { intensity: +$('intensity').value, blend: +$('blend').value });
    markEmotion();
  }
  function markEmotion() {
    document.querySelectorAll('[data-emotion]').forEach((el) => el.classList.toggle('on', el.dataset.emotion === b.emotion));
  }
  function togglePause() { paused = !paused; $('pause').classList.toggle('on', paused); }

  function draw() {
    clear();
    const inside = mouseX >= 0 && mouseX < width && mouseY >= 0 && mouseY < height;
    b.lookAt(...($('follow').checked && inside ? [mouseX, mouseY] : [null]));
    if (reaching) b.reach(...(inside ? [mouseX, mouseY] : [null]));
    if (!paused || stepOnce) { b.update(1 / FPS); stepOnce = false; }
    b.draw();   // global mode: draws on the sketch canvas
  }

  function mousePressed(e) {
    if (e.target !== $('stage').querySelector('canvas')) return;
    const d = Math.abs(mouseX - b.x);
    if (d > 2) b.moveTo(mouseX, constrain(d / 250, 0.6, 3.5));
  }

  function keyPressed() {
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'number') return;
    const n = parseInt(key, 10);
    if (n >= 1 && n <= BrianWagon.EMOTIONS.length) setEmotion(BrianWagon.EMOTIONS[n - 1]);
    else if (keyCode === LEFT_ARROW) b.face('left');
    else if (keyCode === RIGHT_ARROW) b.face('right');
    else if (key === ' ') { togglePause(); return false; }
    else if (key === 'b') b.trigger('blink');
    else if (key === 'h') b.trigger('hop');
    else if (key === 'c') b.trigger('confetti');
    else if (key === 's') savePng();
    else if (key === 'p') { propIx = (propIx + 1) % BrianWagon.PROPS.length; b.grab(BrianWagon.PROPS[propIx]); }
    else if (key === 'r') b.release();
  }

  // Transparent 1920x1080 still of the current frame.
  function savePng() {
    const k = 1920 / W, g = createGraphics(1920, 1080);
    g.pixelDensity(1);
    g.clear();
    // The brush canvas is sized for the live sketch; give it the still's size for this one draw.
    const bs = b._bs, live = [drawingContext.canvas.width, drawingContext.canvas.height];
    if (bs) bs.resize(g.drawingContext.canvas.width, g.drawingContext.canvas.height);
    b.draw(g, { x: b.x * k, y: b.y * k, scale: b.scale * k });
    if (bs) bs.resize(...live);
    save(g, `brian-${b.emotion}-${nf(frameCount, 5)}.png`);
    g.remove();
  }
</script>
</body>
</html>
