<!doctype html>
<!-- Headless render target for export.mjs.  Plays a cue list at a fixed frame
     step and hands back each frame as a transparent PNG. -->
<html>
<head>
<meta charset="utf-8">
<title>Brian Wagon render</title>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="brian-wagon.js"></script>
<script>
  let spec, rig, canvas, ctx, cues, next;

  function applyCue(c) {
    if (c.emotion) rig.setEmotion(c.emotion, { intensity: c.intensity ?? 1, blend: c.blend ?? 0.3 });
    if ('lookAt' in c) c.lookAt ? rig.lookAt(c.lookAt[0], c.lookAt[1]) : rig.lookAt(null);
    if (c.face) rig.face(c.face);
    if (c.setX != null) rig.setX(c.setX);
    if (c.moveTo) rig.moveTo(c.moveTo.x, c.moveTo.seconds ?? 1.5, { ease: c.moveTo.ease ?? 'inOut' });
    if ('reach' in c) c.reach ? rig.reach(c.reach[0], c.reach[1]) : rig.reach(null);
    if ('jaw' in c) rig.jaw(c.jaw);
    if (c.grab) rig.grab(typeof c.grab === 'string' ? c.grab : c.grab.prop, typeof c.grab === 'string' ? {} : { at: c.grab.at });
    if (c.release) rig.release();
    for (const t of [].concat(c.trigger || [])) rig.trigger(t);
  }

  window.setup = (s) => {
    spec = s;
    canvas = document.getElementById('c');
    canvas.width = spec.width; canvas.height = spec.height;
    ctx = canvas.getContext('2d');
    const r = spec.rig || {};
    rig = new BrianWagon({
      seed: spec.seed ?? 1, shadows: !!spec.shadows,
      x: r.x ?? spec.width / 2, y: r.y ?? spec.height * 0.85, scale: r.scale ?? spec.height * 0.02,
      facing: r.facing ?? 'right', emotion: r.emotion ?? 'neutral',
      ...(spec.options || {}),
    });
    cues = (spec.cues || []).map((c, i) => ({ ...c, i })).sort((a, b) => a.t - b.t || a.i - b.i);
    next = 0;
    return Math.round((spec.duration ?? 5) * (spec.fps ?? 30));
  };

  // Frames must be requested in order, starting at 0.
  window.renderFrame = (i) => {
    const fps = spec.fps ?? 30;
    if (i > 0) rig.update(1 / fps);
    while (next < cues.length && cues[next].t <= i / fps + 1e-9) applyCue(cues[next++]);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    rig.draw(ctx);
    return canvas.toDataURL('image/png');
  };
</script>
</body>
</html>
