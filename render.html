<!doctype html>
<!-- Headless render target for export.mjs.  Plays a cue list at a fixed frame
     step and hands back each frame as a transparent PNG. -->
<html>
<head>
<meta charset="utf-8">
<title>Brian Wagon render</title>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="vendor/brush.js"></script>
<script src="brush-style.js"></script>
<script src="brian-wagon.js"></script>
<script>
  let spec, rig, canvas, ctx, cues, next, fade = { a: 0, from: 0, to: 0, t0: 0, dur: 1 };

  function applyCue(c) {
    rig.cue(c);
    if (c.fade) fade = { from: fade.a, to: c.fade[0], t0: c.t, dur: Math.max(c.fade[1], 1e-3), a: fade.a };
  }

  window.setup = (s) => {
    spec = s;
    canvas = document.getElementById('c');
    canvas.width = spec.width; canvas.height = spec.height;
    ctx = canvas.getContext('2d');
    const r = spec.rig || {};
    rig = new BrianWagon({
      seed: spec.seed ?? 1, shadows: !!spec.shadows,
      x: r.x ?? spec.width / 2, y: r.y ?? spec.height * 0.85, scale: r.scale ?? spec.height * 0.02,
      facing: r.facing ?? 'right', emotion: r.emotion ?? 'neutral',
      ...(spec.options || {}),
    });
    if (spec.stage) rig.setStage(spec.stage);
    if (spec.style) rig.setStyle(spec.style);   // 'brush' | 'flat' | { mode, layers, ...brush options }
    cues = (spec.cues || []).map((c, i) => ({ ...c, i })).sort((a, b) => a.t - b.t || a.i - b.i);
    next = 0;
    return Math.round((spec.duration ?? 5) * (spec.fps ?? 30));
  };

  // Frames must be requested in order, starting at 0.
  // draw = false only advances the simulation (used to reach a still without painting every frame).
  window.renderFrame = (i, draw = true) => {
    const fps = spec.fps ?? 30;
    if (i > 0) rig.update(1 / fps);
    while (next < cues.length && cues[next].t <= i / fps + 1e-9) applyCue(cues[next++]);
    if (!draw) return null;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (spec.background) { ctx.fillStyle = spec.background; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    rig.draw(ctx);
    const k = Math.min(1, Math.max(0, (i / fps - fade.t0) / fade.dur));
    fade.a = fade.from + (fade.to - fade.from) * k * k * (3 - 2 * k);
    if (fade.a > 0.001) { ctx.fillStyle = `rgba(0,0,0,${fade.a})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    return canvas.toDataURL('image/png');
  };
</script>
</body>
</html>
